[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imperio-dos-sete"
version = "1.0.0"
description = "Automação de blog com IA (Groq): pautas, artigos, imagem de destaque e publicação no WordPress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seu Nome" }]
keywords = ["automação", "blog", "groq", "wordpress", "ia", "content-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "requests==2.32.3",
    "urllib3==2.2.3",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "Markdown==3.7",
    "Pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "types-PyYAML",
    "types-Markdown",
]

[project.urls]
Repositorio = "https://github.com/SEU_USUARIO/imperio-dos-sete"

# Cada etapa do pipeline vira um comando de terminal de verdade depois de
# `pip install -e .`, em vez de precisar lembrar o caminho do módulo:
#   gerar-temas / escrever-materias / gerar-imagem / publicar-wordpress
[project.scripts]
gerar-temas = "imperio_dos_sete.gerador_temas:main"
escrever-materias = "imperio_dos_sete.escritor_materias:main"
gerar-imagem = "imperio_dos_sete.gerador_imagem:main"
publicar-wordpress = "imperio_dos_sete.publicador_wordpress:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/imperio_dos_sete"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
